<style>
:root{--bg:#f8f7f4;--ink:#000;--muted:#55534f;--line:rgba(0,0,0,.18);color-scheme:light;

html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:1.125rem;line-height:1.7;}
a{color:inherit;}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:var(--ink);z-index:5;}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.25rem;}
.top{display:flex;justify-content:flex-end;gap:1.5rem;padding:1rem 1.25rem 0;font-size:1.05rem;}
.top a{text-decoration:none;border-bottom:1px solid transparent;}
.top a:hover,.top a.on{border-bottom-color:var(--ink);}
.ttl{display:block;width:100%;height:auto;}
.photo{display:block;width:100%;height:auto;aspect-ratio:3107/756;object-fit:cover;}
.mini{display:block;width:min(340px,80vw);margin:.5rem 0 0;}
h1.page{font-size:clamp(2.4rem,8vw,4rem);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:2.5rem 0 2rem;}
.post-row{display:grid;grid-template-columns:8rem 1fr;gap:1.5rem;padding:1.5rem 0;border-top:1px solid var(--line);text-decoration:none;}
.post-row time{color:var(--muted);font-size:.95rem;padding-top:.45rem;}
.post-row h2{margin:0 0 .35rem;font-size:1.6rem;line-height:1.2;font-weight:600;letter-spacing:-.01em;}
.post-row:hover h2{text-decoration:underline;text-underline-offset:5px;}
.post-row p{margin:0;color:var(--muted);}
article{padding:1rem 0 3rem;}
article h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.08;font-weight:800;letter-spacing:-.025em;margin:1rem 0 .75rem;}
.meta{color:var(--muted);font-size:1rem;margin-bottom:2.5rem;}
article p{margin:0 0 1.4rem;}
article p:first-of-type::first-letter{font-size:3.4em;float:left;line-height:.85;padding:.08em .1em 0 0;font-weight:800;}
blockquote{margin:2rem 0;padding-left:1.25rem;border-left:3px solid var(--ink);font-style:italic;font-size:1.3rem;line-height:1.5;}
.back{display:inline-block;font-size:1rem;margin-top:1.5rem;}
.pn{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:1.25rem;font-size:1rem;}
.pn a{max-width:48%;}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.95rem;padding:1.5rem 0 3rem;margin-top:2rem;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
@media (max-width:560px){.post-row{grid-template-columns:1fr;gap:.25rem;}.post-row time{padding-top:0;}.photo{aspect-ratio:4/3;}}
@media (prefers-reduced-motion:no-preference){main{animation:in .35s ease-out;}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>

var NAME = "The Diary of Cash Oakmond-Rockwell";
var main = document.getElementById("main"), bar = document.getElementById("bar");

function fmt(d){ try { return new Date(d+"T12:00:00").toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}); } catch(e){ return d; } }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function paras(arr){ return arr.map(function(t){ return t.charAt(0)==="“" ? "<blockquote>"+esc(t.replace(/[“”]/g,""))+"</blockquote>" : "<p>"+esc(t)+"</p>"; }).join(""); }
function row(p){ return '<a class="post-row" href="#'+p.slug+'"><time datetime="'+p.date+'">'+fmt(p.date)+'</time><div><h2>'+esc(p.title)+'</h2><p>'+esc(p.summary)+'</p></div></a>'; }

function home(){
  document.title = NAME; nav("home");
  main.innerHTML = '<h1 class="sr">'+NAME+'</h1>'+T("ttl")+'<img class="photo" src="'+PHOTO+'" alt="A green hillside meadow with wildflowers and forest beyond">';
}
function notes(){

  main.innerHTML = wrap('<h1 class="sr">Notes</h1><div style="height:1.5rem"></div>'+POSTS.map(row).join(""));
}
function post(i){
  var p = POSTS[i], prev = POSTS[i+1], next = POSTS[i-1];
  document.title = p.title+" – "+NAME; nav("notes");
  main.innerHTML = wrap('<article><a class="back" href="#notes">Back to the notes</a><h1>'+esc(p.title)+'</h1><div class="meta">'+fmt(p.date)+', '+esc(p.read)+'</div>'+paras(p.body)+'</article>'+
    '<div class="pn"><span>'+(prev?'<a href="#'+prev.slug+'">Older: '+esc(prev.title)+'</a>':'')+'</span><span style="text-align:right">'+(next?'<a href="#'+next.slug+'">Newer: '+esc(next.title)+'</a>':'')+'</span></div>');
}
function route(){
  var h = location.hash.slice(1), i = POSTS.findIndex(function(p){ return p.slug===h; });
  if(i>=0) post(i); else if(h==="notes") notes(); else home();
  window.scrollTo(0,0); progress();
}
function progress(){
  var d = document.documentElement, max = d.scrollHeight - window.innerHeight;
  bar.style.width = (max>0 ? Math.min(100, window.scrollY/max*100) : 0) + "%";
}

window.addEventListener("scroll", progress, {passive:true});
route();
